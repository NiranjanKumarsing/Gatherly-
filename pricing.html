<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatherly - Pricing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="wrap nav-in flex j-bet">
      <a href="index.html" class="logo"><i class="fas fa-users-rays"></i> Gatherly</a>
      <div class="nav-lnks flex gap">
        <a href="index.html">Home</a>
        <a href="pricing.html" class="act">Pricing</a>
        <button class="tog-theme"><i class="fas fa-adjust"></i></button>
        <span style="width:1px; height:20px; background:var(--brd)"></span>
        <a href="login.html" class="auth-guest">Sign in</a>
        <a href="dashboard.html" class="btn auth-user hide">Dashboard</a>
      </div>
      <div class="menu-btn"><i class="fas fa-bars"></i></div>
    </div>
  </nav>

  <div class="mob flex col">
    <div class="flex j-bet w-full mb">
      <span class="logo">Menu</span>
      <i class="fas fa-times close-menu" style="font-size:1.5rem"></i>
    </div>
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
  </div>

  <div class="wrap mt mb">
    <div class="txt-c mb"><h1>Simple Pricing</h1><p>Start for free, scale as you grow.</p></div>
    <div class="grid g3">
      <div class="card txt-c">
        <h3>Starter</h3>
        <div class="price">$0</div>
        <p class="mb">For hobbyists.</p>
        <a href="login.html" class="btn-o w-full">Get Started</a>
      </div>
      <div class="card pop txt-c">
        <span class="badge">Popular</span>
        <h3>Growth</h3>
        <div class="price">$29</div>
        <p class="mb">For creators.</p>
        <a href="login.html" class="btn w-full">Free Trial</a>
      </div>
      <div class="card txt-c">
        <h3>Scale</h3>
        <div class="price">Custom</div>
        <p class="mb">For organizations.</p>
        <a href="contact.html" class="btn-o w-full">Contact Sales</a>
      </div>
    </div>
  </div>
  <footer><div class="wrap txt-c">&copy; 2025 Gatherly.</div></footer>
  <script src="script.js"></script>
