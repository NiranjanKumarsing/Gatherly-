<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gatherly - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div style="height: 100vh" class="flex j-cen">
    <div class="card" style="width: 100%; max-width: 400px">
      <div class="txt-c mb">
        <a href="index.html" class="logo"><i class="fas fa-users-rays"></i> Gatherly</a>
        <h2 class="mt">Welcome Back</h2>
      </div>
      <form id="login-form">
        <div class="mb">
          <label>Email</label>
          <input type="email" class="inp" value="demo@gatherly.com" required>
        </div>
        <div class="mb">
          <label>Password</label>
          <input type="password" class="inp" value="password" required>
        </div>
        <button type="submit" class="btn w-full">Sign In</button>
      </form>
      <div class="txt-c mt"><a href="index.html" class="txt-p">Back to Home</a></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
